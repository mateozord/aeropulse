[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: React Router handles routes like /war-room and /airports/:iata
# client-side, so any path that isn't a real file or an /api/* function needs
# to resolve to index.html instead of Netlify's static 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
